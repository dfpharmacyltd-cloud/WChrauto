<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR Mail Desk | West-Coast Pharmaceutical Works Ltd.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,600..800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<style>
:root{
  --navy:#393185;--blue:#008DD2;--sky:#00A0E3;
  --ink:#1D2140;--muted:#5D6382;--line:#DCE2EC;--bg:#F1F4F8;--surface:#fff;--soft:#F7F9FC;
  --ok:#17804F;--okbg:#E4F3EA;--warn:#8A5A0B;--warnbg:#FBF0DA;--err:#B42828;--errbg:#FBE8E8;
  --info:#0B6FA6;--infobg:#E2F1FA;--grey:#555B72;--greybg:#ECEEF4;--r:8px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14.5px;line-height:1.5;color:var(--ink);background:var(--bg)}
h1,h2,h3{font-family:'Archivo','Arial Narrow',Arial,sans-serif;font-stretch:88%;color:var(--navy);margin:0;line-height:1.2}
h1{font-size:24px;font-weight:750}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0 0 10px}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
button,input,select,textarea{font:inherit;color:inherit}

.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:30}
.brand{padding:22px 20px 16px;border-bottom:1px solid var(--line)}
.brand img{width:100%;max-width:196px;display:block}
.brand img[hidden],.brand [hidden]{display:none}
.brand .wordmark{font-family:Archivo,sans-serif;font-stretch:85%;font-weight:800;color:var(--navy);font-size:19px;line-height:1.15}
.brand .wordmark small{display:block;font-weight:600;color:var(--muted);font-size:12.5px;font-stretch:100%;margin-top:2px}
.brand-sub{font-family:Archivo,sans-serif;font-stretch:85%;font-weight:650;color:var(--blue);margin-top:10px;font-size:15px}
nav{padding:10px;flex:1;overflow:auto}
nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:6px;color:var(--ink);text-decoration:none;font-weight:500;margin-bottom:2px}
nav a:hover{background:var(--soft)}
nav a.on{background:#EAF0FA;color:var(--navy);box-shadow:inset 3px 0 0 var(--blue);font-weight:600}
.badge{font-size:12px;min-width:22px;padding:1px 7px;border-radius:10px;background:var(--navy);color:#fff;text-align:center;font-weight:600}
.badge.warn{background:var(--warn)}
.conn{margin:12px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--soft);font-size:13.5px}
#gconn{margin-top:0}
.conn .state{display:flex;align-items:center;gap:8px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:#B9BFD0;flex:none}
.dot.on{background:var(--ok)}.dot.busy{background:var(--sky);animation:pulse 1.2s infinite}.dot.bad{background:var(--err)}
@keyframes pulse{50%{opacity:.35}}
.conn .who{color:var(--muted);margin:4px 0 10px;overflow-wrap:anywhere}
.conn .btn{width:100%;justify-content:center;margin-top:6px}
.progress{height:6px;background:var(--greybg);border-radius:4px;overflow:hidden;margin:8px 0 4px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--navy));width:0;transition:width .3s}

main{min-width:0}
.top{display:flex;align-items:center;gap:14px;padding:18px 28px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .menu{display:none;border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 10px;font-size:18px;cursor:pointer}
.top-meta{margin-left:auto;color:var(--muted);font-size:13.5px;text-align:right}
.view{padding:24px 28px 48px;max-width:1400px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:600;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:#2D2670}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{color:var(--err)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.card h2{margin-bottom:12px}
.card .hint{color:var(--muted);font-size:13.5px;margin-top:-6px;margin-bottom:12px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;cursor:pointer;text-align:left;border-top:3px solid var(--blue)}
.kpi:hover{background:var(--soft)}
.kpi.navy{border-top-color:var(--navy)}.kpi.warn{border-top-color:#D9902A}.kpi.sky{border-top-color:var(--sky)}
.kpi .n{font-family:Archivo,sans-serif;font-stretch:88%;font-size:34px;font-weight:800;color:var(--navy);line-height:1.1}
.kpi .l{color:var(--muted);font-weight:500}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:4px}
.two{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}

.chart svg{width:100%;height:auto;display:block}
.chart .bar{fill:var(--blue)}.chart .bar.today{fill:var(--navy)}
.chart text{font-size:11px;fill:var(--muted);font-family:'Instrument Sans',sans-serif}
.chart .val{fill:var(--ink);font-weight:600}
.hbars{display:grid;gap:9px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:4px 10px;align-items:center;cursor:pointer}
.hbar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.hbar .c{text-align:right;font-weight:600;color:var(--navy)}
.hbar .track{grid-column:1/-1;height:6px;background:var(--greybg);border-radius:4px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--sky);border-radius:4px}
.hbar:hover .t{color:var(--blue)}

.mini{display:grid;gap:0}
.mini a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.mini a:first-child{border-top:0}
.mini a:hover b{color:var(--blue)}
.mini .m{color:var(--muted);font-size:13px;grid-column:1}
.mini .d{color:var(--muted);font-size:12.5px;grid-row:1/3;grid-column:2;align-self:center;text-align:right}
.empty{color:var(--muted);padding:18px 4px;text-align:center}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar input[type=search],.toolbar select{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;min-width:0}
.toolbar input[type=search]{flex:1 1 240px}
.toolbar .sp{flex:1}
.check{display:inline-flex;gap:6px;align-items:center;font-weight:500;cursor:pointer}
.bulk{display:none;align-items:center;gap:8px;padding:8px 12px;background:var(--infobg);border-radius:6px;margin-bottom:10px;flex-wrap:wrap}
.bulk.show{display:flex}

.tablewrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:auto}
table{width:100%;border-collapse:collapse;min-width:900px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--soft);font-weight:600;color:var(--muted);font-size:13px;position:sticky;top:0;white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover{background:#F6F9FD}
tbody tr:last-child td{border-bottom:0}
td .nm{font-weight:600;color:var(--navy)}
td .sub{color:var(--muted);font-size:13px}
td select{padding:3px 6px;border:1px solid var(--line);border-radius:5px;background:#fff;font-size:13px}
.chip{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.err{background:var(--errbg);color:var(--err)}.chip.info{background:var(--infobg);color:var(--info)}.chip.grey{background:var(--greybg);color:var(--grey)}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;color:var(--muted)}

.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.form label{display:block;font-weight:600;font-size:13px;color:var(--muted);margin-bottom:3px}
.form input,.form select,.form textarea,.field input,.field select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
.form .full{grid-column:1/-1}
.form textarea{min-height:70px;resize:vertical}
.field{margin-bottom:12px}
.field label{display:block;font-weight:600;margin-bottom:3px}
.field .help{color:var(--muted);font-size:13px;margin-top:3px}
.copyrow{display:flex;gap:8px}
.copyrow input{flex:1;background:var(--soft)!important}
.note{padding:10px 14px;border-radius:6px;background:var(--infobg);color:var(--info);margin-bottom:14px}
.note.warn{background:var(--warnbg);color:var(--warn)}

.modal-back{position:fixed;inset:0;background:rgba(29,33,64,.45);display:none;align-items:flex-start;justify-content:center;padding:4vh 16px;z-index:100;overflow:auto}
.modal-back.show{display:flex}
.modal{background:#fff;border-radius:10px;width:min(920px,100%);box-shadow:0 20px 60px rgba(29,33,64,.25)}
.modal .mh{display:flex;gap:12px;align-items:flex-start;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal .mh .x{margin-left:auto;border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.modal .mb{padding:18px 22px}
.modal .mf{display:flex;flex-wrap:wrap;gap:8px;padding:14px 22px;border-top:1px solid var(--line);background:var(--soft);border-radius:0 0 10px 10px}
.meta{display:grid;grid-template-columns:130px 1fr;gap:4px 12px;font-size:13.5px;margin-bottom:16px;padding:12px 14px;background:var(--soft);border-radius:6px}
.meta dt{color:var(--muted)}.meta dd{margin:0;overflow-wrap:anywhere}
.toasts{position:fixed;right:18px;bottom:18px;display:grid;gap:8px;z-index:200}
.toast{background:var(--ink);color:#fff;padding:10px 14px;border-radius:6px;max-width:360px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.err{background:var(--err)}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two,.three{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;width:270px;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .side.open{transform:none}
  .top .menu{display:block}
  .top{padding:14px 16px}.view{padding:16px}
  .form{grid-template-columns:1fr}
  .top-meta{display:none}
}

</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <img id="brandLogo" alt="West-Coast Pharmaceutical Works Ltd." hidden>
      <div class="wordmark" id="wordmark">West-Coast<small>Pharmaceutical Works Ltd.</small></div>
      <div class="brand-sub">HR Mail Desk</div>
    </div>
    <nav id="nav" aria-label="Main"></nav>
    <div class="conn" id="conn"></div>
    <div class="conn" id="gconn"></div>
  </aside>
  <main>
    <header class="top">
      <button class="menu" id="menuBtn" aria-label="Open menu">☰</button>
      <h1 id="pageTitle">Dashboard</h1>
      <div class="top-meta" id="topMeta"></div>
    </header>
    <section id="view" class="view"></section>
  </main>
</div>
<div class="modal-back" id="modalBack"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>
/* ===== PARSER START ===== */
const Parser = (() => {
  const SKILLS = ['HPLC','UPLC','GC','GC-MS','LC-MS','UV','FTIR','IR','AAS','ICP-MS','KF','Karl Fischer','Dissolution','Disintegration',
    'Friability','Hardness','Potentiometer','Auto Titrator','Polarimeter','TOC','Particle Size','Malvern','Empower','Chromeleon',
    'LabSolutions','OpenLAB','LIMS','SAP','Method Validation','Method Development','AMV','Stability','Calibration','Equipment Qualification',
    'Validation','Process Validation','Cleaning Validation','GMP','cGMP','GLP','GDP','Good Documentation Practices','SOP','Documentation','QMS',
    'CAPA','Deviation','Change Control','OOS','OOT','Market Complaint','IPQA','Line Clearance','BMR','BPR','APQR','Audit','USFDA',
    'WHO-GMP','EU-GMP','MHRA','TGA','Schedule M','Data Integrity','21 CFR Part 11','Microbiology','Sterility','BET','Endotoxin',
    'Environmental Monitoring','MLT','Water Analysis','Media Fill','Tablet','Capsule','Granulation','Compression','Coating','Blending',
    'Capsule Filling','Liquid Oral','Ointment','Injectable','Sterile','Lyophilization','Aseptic','Packing','Blister','Formulation',
    'Pre-formulation','Tech Transfer','Scale-up','Regulatory Affairs','CTD','eCTD','DMF','ANDA','Dossier','Pharmacovigilance',
    'Warehouse','Inventory','Dispensing','Maintenance','HVAC','Utilities','MS Excel','MS Office','Tally','Nutraceutical'];
  const SKILL_RX = SKILLS.map((s) => [s, new RegExp('(^|[^A-Za-z0-9])' + s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/[\s-]/g, '[\\s-]?') + '(?![A-Za-z0-9])', 'i')]);

  const DEGREES = [ // highest first
    ['Ph.D', /\bph\.?\s?d\b/i], ['M.Pharm', /\bm\.?\s?pharm/i], ['Pharm.D', /\bpharm\.?\s?d\b/i], ['M.Sc', /\bm\.?\s?sc\b/i],
    ['M.Tech', /\bm\.?\s?tech\b/i], ['MBA', /\bm\.?\s?b\.?\s?a\b/i], ['M.Com', /\bm\.?\s?com\b/i], ['B.Pharm', /\bb\.?\s?pharm/i],
    ['B.Sc', /\bb\.?\s?sc\b/i], ['B.Tech', /\bb\.?\s?tech\b/i], ['B.E', /\bB\.\s?E\b\.?/], ['B.Com', /\bb\.?\s?com\b/i],
    ['D.Pharm', /\bd\.?\s?pharm/i], ['Diploma', /\bdiploma\b/i], ['ITI', /\bI\.?T\.?I\b/], ['HSC', /\b(H\.?S\.?C|12th|XII)\b/i], ['SSC', /\b(S\.?S\.?C|10th)\b/i],
  ];
  const CITIES = ['Ahmedabad','Gandhinagar','Kalol','Mehsana','Mahesana','Kadi','Chhatral','Chattral','Vadodara','Baroda','Surat','Rajkot','Anand','Nadiad',
    'Bharuch','Ankleshwar','Vapi','Valsad','Navsari','Himmatnagar','Sanand','Changodar','Bavla','Dahej','Jamnagar','Bhavnagar','Junagadh',
    'Palanpur','Patan','Modasa','Visnagar','Unjha','Kheda','Dholka','Viramgam','Gandhidham','Bhuj','Morbi','Amreli','Godhra','Dahod',
    'Mumbai','Thane','Pune','Nashik','Aurangabad','Hyderabad','Indore','Udaipur','Jaipur','Delhi','Noida','Gurgaon','Bengaluru',
    'Bangalore','Chennai','Kolkata','Goa','Baddi','Sikkim','Lucknow','Bhopal','Nagpur','Visakhapatnam','Vizag','Silvassa','Daman'];
  const PORTALS = [['naukri', 'Naukri'], ['indeed', 'Indeed'], ['linkedin', 'LinkedIn'], ['shine', 'Shine'], ['foundit', 'foundit'],
    ['monster', 'foundit'], ['apna', 'apna'], ['workindia', 'WorkIndia'], ['timesjobs', 'TimesJobs'], ['pharmajobs', 'Pharma jobs portal']];
  const ROLE_RX = /\b(Q\.?C|Q\.?A|IPQA|Quality\s+Control|Quality\s+Assurance|Production|Microbiology|Micro|Regulatory\s+Affairs|R\s?&\s?D|Formulation(?:\s+Development)?|F&D|AMV|Analytical(?:\s+R&D)?|ADL|Stores?|Warehouse|Engineering|Maintenance|Packing|Packaging|Purchase|Accounts|HR|Validation|Pharmacovigilance|Business\s+Development|Export|Marketing|Sales)\s*(?:Dept\.?\s*)?[-–]?\s*(Officer|Sr\.?\s*Officer|Executive|Sr\.?\s*Executive|Senior\s+Executive|Chemist|Analyst|Associate|Trainee|Manager|Asst\.?\s*Manager|Assistant\s+Manager|Dy\.?\s*Manager|Supervisor|Operator|Head|Scientist|In-?charge|Assistant|Pharmacist|Engineer|Technician)?\b/i;
  const SOLO_ROLE_RX = /\b(Microbiologist|Pharmacist|Chemist|Machine\s+Operator|Lab\s+Assistant|Trainee|Formulation\s+Scientist|Research\s+Scientist|Electrician|Fitter|Driver|Accountant|Store\s+Keeper)\b/i;

  const title = (s) => s.toLowerCase().replace(/(^|[\s.'-])([a-z])/g, (m, a, b) => a + b.toUpperCase());
  const tidy = (s) => String(s || '').replace(/\s+/g, ' ').replace(/^[\s:,\-–|.]+|[\s:,\-–|]+$/g, '').trim();
  const lines = (t) => String(t || '').split(/\r?\n/).map((l) => l.replace(/\s+/g, ' ').trim()).filter(Boolean);
  const label = (text, names, max = 80) => {
    const rx = new RegExp('(?:^|\\n)\\s*(?:' + names + ')\\s*(?:[:\\-–]|\\.{2,})\\s*([^\\n]{1,' + max + '})', 'i');
    const m = String(text).match(rx); return m ? tidy(m[1]) : '';
  };

  function emails(t) {
    return [...new Set((String(t).match(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g) || []).map((e) => e.replace(/\.$/, '').toLowerCase()))]
      .filter((e) => !/(noreply|no-reply|donotreply|mailer|notification|jobs@|careers@|hr@|recruit)/i.test(e));
  }
  function phones(t) {
    const out = [];
    for (const m of String(t).match(/\+?\d[\d\s\-().]{8,17}\d/g) || []) {
      let d = m.replace(/\D/g, '');
      if (d.length === 12 && d.startsWith('91')) d = d.slice(2);
      else if (d.length === 11 && d.startsWith('0')) d = d.slice(1);
      if (d.length === 10 && /^[6-9]/.test(d) && !/^(\d)\1{9}$/.test(d)) out.push(d);
    }
    return [...new Set(out)].map((d) => `+91 ${d.slice(0, 5)} ${d.slice(5)}`);
  }
  const looksLikeName = (s) => {
    s = tidy(s.replace(/^(mr|mrs|ms|miss|dr|shri|smt)\.?\s+/i, ''));
    if (!s || s.length > 40 || /\d|@|http/.test(s)) return '';
    if (/\b(resume|r[eé]sum[eé]|curriculum|vitae|bio[\s-]?data|profile|cv|objective|address|contact|mobile|email|phone|career|summary|personal|details|page|dear|sir|madam|hr|team|manager|department|pharma|limited|ltd|company|application|post|regards|thanks|ahmedabad|gujarat|india|declaration|education|experience)\b/i.test(s)) return '';
    const w = s.split(' ');
    if (w.length < 2 || w.length > 4) return '';
    if (!w.every((x) => /^[A-Za-z][A-Za-z.'-]*$/.test(x) && /^[A-Z]/.test(x))) return '';
    return s === s.toUpperCase() || s === s.toLowerCase() ? title(s) : s;
  };
  function nameFromCv(t) {
    const l = label(t, 'name|full name|candidate name|name of (?:the )?candidate', 50);
    if (l && looksLikeName(l)) return looksLikeName(l);
    for (const ln of lines(t).slice(0, 10)) { const n = looksLikeName(ln.split(/[|,]/)[0]); if (n) return n; }
    return '';
  }
  function nameFromEmail(body, senderName) {
    const b = String(body);
    let m = b.match(/\b(?:my name is|myself|i am|this is)\s+((?:[A-Z][a-z]+|[A-Z]+)(?:\s+(?:[A-Z][a-z]+|[A-Z]+)){1,3})\b/);
    if (m && looksLikeName(m[1])) return looksLikeName(m[1]);
    const L = lines(b);
    for (let i = 0; i < L.length; i++) {
      if (/(thanks|thank you|regards|sincerely|faithfully|truly)[\s,.!]*$/i.test(L[i])) {
        for (const nx of L.slice(i + 1, i + 3)) { const n = looksLikeName(nx.replace(/[,.]$/, '')); if (n) return n; }
      }
    }
    const s = looksLikeName(String(senderName || '').replace(/[._]/g, ' '));
    return s || '';
  }
  function experience(t) {
    const s = String(t);
    let m = s.match(/(?:total|overall)?\s*(?:work(?:ing)?\s+|industr(?:y|ial)\s+|professional\s+)?(?:experience|exp\.?)\s*(?:[:\-–]|of)?\s*(?:about|around|approx\.?|more than|over)?\s*(\d{1,2}(?:\.\d{1,2})?)\s*\+?\s*(?:years?|yrs?)(?:\s*(?:and|&)?\s*(\d{1,2})\s*(?:months?|mths?))?/i)
      || s.match(/(\d{1,2}(?:\.\d{1,2})?)\s*\+?\s*(?:years?|yrs?)(?:\s*(?:and|&)?\s*(\d{1,2})\s*(?:months?|mths?))?\s*(?:of\s+)?(?:total\s+|overall\s+|rich\s+|hands[- ]on\s+|professional\s+|industrial\s+|relevant\s+|work(?:ing)?\s+)?(?:experience|exp\b)/i);
    if (m) { const y = Number(m[1]) + (m[2] ? Number(m[2]) / 12 : 0); if (y > 0 && y < 45) return String(Math.round(y * 10) / 10); }
    m = s.match(/(\d{1,2})\s*(?:months?|mths?)\s*(?:of\s+)?(?:experience|exp\b)/i);
    if (m) return String(Math.round((Number(m[1]) / 12) * 10) / 10);
    if (/\bfresher\b/i.test(s)) return 'Fresher';
    return fromRanges(s);
  }
  // Fallback: add up job date ranges such as "Jun 2019 - Present" (education lines ignored)
  const MON = 'jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec';
  function fromRanges(s) {
    const rx = new RegExp('(?:(' + MON + ')[a-z]*\\.?[\\s,\'-]*)?((?:19|20)\\d{2})\\s*(?:-|–|—|to|till)\\s*(?:(' + MON + ')[a-z]*\\.?[\\s,\'-]*)?((?:19|20)\\d{2}|present|till\\s*date|to\\s*date|date|current|now|ongoing)', 'i');
    const mi = (m) => m ? ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].indexOf(m.toLowerCase().slice(0, 3)) : -1;
    let start = Infinity, end = -Infinity;
    for (const ln of lines(s)) {
      if (DEGREES.some(([, r]) => r.test(ln)) || /(universit|college|school|institute|cgpa|percentage|%|board)/i.test(ln)) continue;
      const m = ln.match(rx); if (!m) continue;
      const a = Number(m[2]) * 12 + Math.max(0, mi(m[1]));
      const now = new Date();
      const b = /^\d/.test(m[4]) ? Number(m[4]) * 12 + (m[3] ? mi(m[3]) : 0) : now.getFullYear() * 12 + now.getMonth();
      if (b > a && b - a < 480) { start = Math.min(start, a); end = Math.max(end, b); }
    }
    if (!isFinite(start)) return '';
    const y = Math.round(((end - start) / 12) * 10) / 10;
    return y > 0 && y < 45 ? String(y) : '';
  }
  function education(t) {
    const L = lines(t); const found = [];
    for (const [deg, rx] of DEGREES) {
      const i = L.findIndex((l) => rx.test(l));
      if (i >= 0 && !found.some((f) => f.deg === deg)) {
        let txt = L[i];
        if (txt.length > 110) { const k = txt.search(rx); txt = txt.slice(k).split(/[.;](?:\s|$)|\s+and\s+(?:have|i|am|currently)\b|,\s*(?:and\s+)?(?:i|currently)\b/i)[0].slice(0, 90); }
        else if (txt.length < 25 && L[i + 1] && !/[:@]/.test(L[i + 1]) && !DEGREES.some(([, r]) => r.test(L[i + 1]))) txt += ', ' + L[i + 1];
        found.push({ deg, txt: tidy(txt.replace(/^(education(?:al)?\s*(?:qualifications?|details)?|academic\s*(?:qualifications?|details)?|qualifications?)\s*[:\-–]\s*/i, '')).slice(0, 110) });
      }
      if (found.length >= 2) break;
    }
    return { degree: found[0]?.deg || '', text: found.map((f) => f.txt).join(' | ') };
  }
  function skills(t) { return SKILL_RX.filter(([, rx]) => rx.test(t)).map(([s]) => s).slice(0, 25).join(', '); }
  function role(s) {
    s = String(s || '');
    const all = [...s.matchAll(new RegExp(ROLE_RX.source, 'gi'))];
    const m = all.find((x) => x[2]) || all.find((x) => /^(IPQA|Production|Microbiology|Regulatory|Formulation|AMV|Validation|Pharmacovigilance)/i.test(x[1]));
    if (m) {
      return tidy(m[0]).replace(/\bq\.?c\b/i, 'QC').replace(/\bq\.?a\b/i, 'QA').replace(/^(?!QC|QA|IPQA|AMV|HR|ADL|R\s?&\s?D|F&D)(\S)/, (c) => c.toUpperCase());
    }
    const n = s.match(SOLO_ROLE_RX); return n ? title(n[0]) : '';
  }
  function position(subject, body, cv) {
    const sub = String(subject || '');
    let p = role(sub);
    if (p) return p;
    const lb = label(cv + '\n' + body, 'post applied for|position applied for|applied for(?: the post of)?|post|position|applying for', 50);
    if (lb) return role(lb) || tidy(lb).slice(0, 40);
    const m = (sub + '\n' + body).match(/(?:application|applying|apply|applied|candidature|resume|cv)\s+(?:for|of)\s+(?:the\s+)?(?:post|position|role|job|vacancy|opening)?\s*(?:of|as|for)?\s*(?:an?\s+)?([A-Za-z][A-Za-z.&/ -]{2,45})/i);
    if (m) {
      const v = tidy(m[1].replace(/\b(in|at|with)\s+(your|the|west).*$/i, '').replace(/\b(post|position|vacancy|job|opening|role)\b.*$/i, ''));
      if (v && !/^(the|a|an|job|any|suitable|your|this|it)$/i.test(v)) return role(v) || title(v);
    }
    return role(body) || role(String(cv).slice(0, 1500));
  }
  function location(t) {
    const lb = label(t, 'current location|present location|location|city|place|residing at|permanent address|present address|address|native place', 90);
    const city = (s) => CITIES.map((c) => [c, s.search(new RegExp('\\b' + c + '\\b', 'i'))]).filter(([, i]) => i >= 0).sort((a, b) => a[1] - b[1])[0]?.[0];
    if (lb) return city(lb) || tidy(lb.split(/,/).slice(-2).join(', ')).slice(0, 40);
    const top = String(t).slice(0, Math.max(1200, String(t).length * 0.35));
    return city(top) || '';
  }
  const ORG = /([A-Z][A-Za-z0-9&.'\- ]{1,50}?\s(?:Pvt\.?\s*Ltd\.?|Private\s+Limited|Limited|Ltd\.?|Pharmaceuticals?|Pharma|Laboratories|Labs|Healthcare|Industries|Lifesciences|Life\s+Sciences|Remedies|Biotech|Formulations))\b/;
  const ORG_WORD = /(pvt|ltd|limited|pharma|laborator|labs|healthcare|industries|life\s?sciences|remedies|biotech|formulations)/i;
  function company(t) {
    const lb = label(t, 'current company|present company|current employer|present employer|current organi[sz]ation|present organi[sz]ation|company name', 70);
    if (lb) return lb;
    const m = String(t).match(/(?:currently|presently)\s+(?:i\s+am\s+)?(?:working|employed|associated)\s+(?:as\s+[^,.\n]{2,40}?\s+)?(?:with|at|in)\s+(?:m\/s\.?\s*)?([A-Z][A-Za-z0-9&.'\- ]{2,60}?)(?=\s+(?:as|since|from|for)\b|[,.;\n(]|$)/i);
    if (m) return tidy(m[1]);
    const L = lines(t);
    for (let i = 0; i < L.length; i++) {
      if (/(present|till\s*date|to\s*date|current(ly)?|ongoing)/i.test(L[i])) {
        for (const c of [L[i], L[i - 1], L[i + 1]]) {
          if (!c) continue;
          const part = c.replace(/\([^)]*\)/g, ' ').split(/\s+[-–|@]\s+|,\s*|\s+at\s+/i).find((x) => ORG_WORD.test(x));
          if (part) return tidy(part.replace(/\b(19|20)\d{2}\b.*$/, ''));
        }
      }
    }
    return '';
  }
  const money = '((?:rs\\.?|inr|₹)?\\s*[\\d.,]+\\s*(?:lpa|l\\.?p\\.?a\\.?|lakhs?|lacs?|lac|k|/-)?\\s*(?:per\\s*(?:month|annum)|p\\.?\\s?a\\.?|p\\.?\\s?m\\.?|monthly|annually|ctc)?)';
  function ctc(t, kind) {
    const rx = kind === 'current'
      ? new RegExp('(?:current|present|existing)\\s*(?:ctc|salary|package|c\\.t\\.c\\.?)\\s*(?:is|[:\\-–])?\\s*' + money, 'i')
      : new RegExp('(?:expected|expectation|desired)\\s*(?:ctc|salary|package|c\\.t\\.c\\.?)?\\s*(?:is|[:\\-–])?\\s*' + money, 'i');
    const m = String(t).match(rx); return m && /\d/.test(m[1]) ? tidy(m[1]) : '';
  }
  function notice(t) {
    if (/\bimmediate(?:ly)?\s*(?:joiner|joining|available|join)/i.test(t)) return 'Immediate';
    const m = String(t).match(/notice\s*period\s*(?:is|of|[:\-–])?\s*(?:of\s*)?([^\n.,;]{1,25})/i);
    return m ? tidy(m[1]) : '';
  }
  const linkedin = (t) => (String(t).match(/(?:https?:\/\/)?(?:[a-z]{2,3}\.)?linkedin\.com\/in\/[A-Za-z0-9_\-%]+/i) || [''])[0];
  function source(senderEmail, body) {
    const s = (String(senderEmail) + ' ' + String(body).slice(0, 3000)).toLowerCase();
    const hit = PORTALS.find(([k]) => String(senderEmail).toLowerCase().includes(k)) || PORTALS.find(([k]) => new RegExp('\\b(via|through|on|from)\\s+' + k).test(s));
    return hit ? hit[1] : 'Direct email';
  }

  const POS_KW = /\b(resume|r[eé]sum[eé]|cv|curriculum vitae|bio[\s-]?data|job application|application for|applying for|apply for|applied for|vacancy|vacancies|candidature|post of|job opening|opening for|seeking (?:a |an )?(?:job|opportunity|position)|looking for (?:a |an )?(?:job|change|opportunity)|fresher|interview|experience certificate)\b/i;
  const NEG_KW = /\b(invoice|quotation|purchase order|\bpo\b|proforma|payment|statement|newsletter|unsubscribe|webinar|otp|verification code|delivery|shipment|dispatch|tender|offer valid|% off|discount|sale|coa|certificate of analysis|meeting|minutes of meeting|gst|e-?way bill|ledger|reminder|password)\b/i;
  const CV_FILE = /(resume|r[eé]sum[eé]|\bcv\b|curriculum|bio[\s-]?data|profile)/i;

  function classify({ subject, body, senderEmail, attachments = [] }) {
    let score = 0; const why = [];
    if (attachments.some((a) => CV_FILE.test(a.name || ''))) { score += 4; why.push('CV attached'); }
    if (POS_KW.test(subject || '')) { score += 3; why.push('subject mentions job/CV'); }
    if (POS_KW.test(String(body || '').slice(0, 3000))) { score += 2; why.push('mail mentions job/CV'); }
    if (PORTALS.some(([k]) => String(senderEmail || '').toLowerCase().includes(k))) { score += 3; why.push('job portal'); }
    if (role(subject)) { score += 2; why.push('post named'); }
    else if (/\b(job|opportunity|opening|position|employment|career|vacancy|requirement)\b/i.test(subject || '')) { score += 2; why.push('subject about a job'); }
    const b3 = String(body || '').slice(0, 3000);
    if (DEGREES.slice(0, 13).some(([, r]) => r.test(b3)) && /\b(experience|fresher|completed|passed|graduat)/i.test(b3)) { score += 1; why.push('mentions qualification'); }
    if (/\b(dear|respected)\s+(hr|h\.r\.|sir\/madam|hiring)/i.test(b3)) { score += 1; }
    if (NEG_KW.test(subject || '')) { score -= 4; why.push('looks like business mail'); }
    if (/unsubscribe/i.test(body || '')) { score -= 3; why.push('newsletter'); }
    return { isCandidate: score >= 3, score, reason: why.join(', ') || 'no job/CV signals' };
  }

  /** Build candidate record from email + optional CV text. CV values win, email fills gaps. */
  function extract({ subject, body, senderName, senderEmail, cvText = '' }) {
    const cv = String(cvText || ''), em = String(body || '');
    const both = cv + '\n' + em;
    const edu = education(cv || em);
    const pick = (a, b) => a || b || '';
    const ph = [...new Set([...phones(cv), ...phones(em)])];
    const mails = [...emails(cv), ...emails(em)];
    const senderOk = senderEmail && !/(noreply|no-reply|naukri|indeed|linkedin|shine|foundit|monster|apna|mailer)/i.test(senderEmail);
    const out = {
      candidate_name: pick(nameFromCv(cv), nameFromEmail(em, senderName)),
      phone: ph[0] || '', alt_phone: ph[1] || '',
      email: mails[0] || (senderOk ? senderEmail.toLowerCase() : ''),
      position: position(subject, em, cv),
      experience_years: pick(experience(cv), experience(em)),
      qualification: edu.degree, education: edu.text,
      skills: skills(both), location: pick(location(cv), location(em)),
      current_company: pick(company(cv), company(em)),
      current_ctc: pick(ctc(cv, 'current'), ctc(em, 'current')),
      expected_ctc: pick(ctc(cv, 'expected'), ctc(em, 'expected')),
      notice_period: pick(notice(cv), notice(em)), linkedin: linkedin(both),
      source: source(senderEmail, em),
    };
    return out;
  }
  return { classify, extract, CV_FILE, _t: { phones, emails, nameFromCv, nameFromEmail, experience, education, position, location, company, ctc, notice, role } };
})();
/* ===== PARSER END ===== */
</script>
<script>
"use strict";
/* ============================================================
   West-Coast HR Mail Desk
   Outlook (Microsoft sign-in, no keys) -> rule-based CV/email reading -> candidate dashboard -> Excel
   Everything runs in the browser. Data stays in this browser (IndexedDB).
   ============================================================ */
const CDN = {
  pdf: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js',
  pdfWorker: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js',
  mammoth: 'https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js',
  xlsx: 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
  tesseract: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
};
const STAGES = ['New', 'Shortlisted', 'Interview', 'On hold', 'Selected', 'Rejected'];
const FIELDS = [
  ['candidate_name', 'Candidate name'], ['phone', 'Mobile'], ['alt_phone', 'Other mobile'], ['email', 'Email'],
  ['position', 'Post applied'], ['qualification', 'Qualification'], ['education', 'Education details', 'full'],
  ['experience_years', 'Experience (years)'], ['current_company', 'Current company'], ['location', 'City'],
  ['current_ctc', 'Current CTC'], ['expected_ctc', 'Expected CTC'], ['notice_period', 'Notice period'],
  ['source', 'Source'], ['skills', 'Skills', 'full'], ['linkedin', 'LinkedIn', 'full'],
];
const DEMO = new URLSearchParams(location.search).has('demo');

/* ---------------- small helpers ---------------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const dayKey = (d) => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`; };
const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const fmtShort = (d) => d ? new Date(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) : '';
const fmtTime = (d) => d ? new Date(d).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '';
function toast(msg, err = false) {
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), err ? 7000 : 3500);
}
const scriptCache = {};
function loadScript(url) {
  if (!scriptCache[url]) scriptCache[url] = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = url; s.onload = res;
    s.onerror = () => { delete scriptCache[url]; rej(new Error('Could not load ' + url.split('/npm/')[1])); };
    document.head.appendChild(s);
  });
  return scriptCache[url];
}

/* ---------------- settings ---------------- */
const SKEY = 'wchd.settings';
const DEFAULT_SHEET = '1fFj0wgon-L8NMS7BRrnfM5DPmsLWa3mAbGdb4KaRk0w';
const S = Object.assign({ clientId: '', tenantId: '', mailbox: '', folder: 'inbox', lookbackDays: 30, autoMinutes: 10, autoOn: true, entryBy: 'HR', logo: '',
  gClientId: '', sheetId: DEFAULT_SHEET, sheetTab: 'Sheet1', sheetTitle: '', saveCvs: true, driveFolderId: '', gConnected: false },
  JSON.parse(localStorage.getItem(SKEY) || '{}'));
const saveSettings = () => localStorage.setItem(SKEY, JSON.stringify(S));
const META_KEY = 'wchd.meta';
const META = Object.assign({ lastScan: '', lastScanResult: '' }, JSON.parse(localStorage.getItem(META_KEY) || '{}'));
const saveMeta = () => localStorage.setItem(META_KEY, JSON.stringify(META));

/* ---------------- IndexedDB ---------------- */
const DB = (() => {
  let dbp;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('wc-hr-mail-desk', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('mails', { keyPath: 'id' }); r.result.createObjectStore('files', { keyPath: 'id' }); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (store, mode, fn) => { const db = await open(); return new Promise((res, rej) => {
    const t = db.transaction(store, mode); const st = t.objectStore(store); const out = fn(st);
    t.oncomplete = () => res(out && 'result' in out ? out.result : out); t.onerror = () => rej(t.error); }); };
  return {
    all: (s) => tx(s, 'readonly', (st) => st.getAll()),
    get: (s, k) => tx(s, 'readonly', (st) => st.get(k)),
    put: (s, v) => tx(s, 'readwrite', (st) => st.put(v)),
    del: (s, k) => tx(s, 'readwrite', (st) => st.delete(k)),
    clear: (s) => tx(s, 'readwrite', (st) => st.clear()),
  };
})();

let MAILS = [];                      // all processed mails (candidates + skipped)
const byId = new Map();
async function loadAll() {
  MAILS = DEMO ? demoData() : await DB.all('mails');
  byId.clear(); MAILS.forEach((m) => byId.set(m.id, m));
}
async function saveMail(m, { touch = true } = {}) {
  if (touch) m.changedAt = new Date().toISOString();
  if (!byId.has(m.id)) MAILS.push(m);
  else MAILS[MAILS.findIndex((x) => x.id === m.id)] = m;
  byId.set(m.id, m);
  if (!DEMO) await DB.put('mails', m);
}
const candidates = () => MAILS.filter((m) => m.isCandidate).sort((a, b) => String(b.received).localeCompare(String(a.received)));
const skipped = () => MAILS.filter((m) => !m.isCandidate).sort((a, b) => String(b.received).localeCompare(String(a.received)));
function issues(m) {
  const c = m.cand || {}; const out = [];
  if (m.error) out.push('Error: ' + m.error);
  if (!c.candidate_name) out.push('Name not found');
  if (!c.phone && !c.email) out.push('No mobile or email found');
  if (!c.position) out.push('Post not found');
  if (['scanned', 'unreadable', 'download-failed'].includes(m.cvStatus)) out.push({ scanned: 'CV is a scanned image', unreadable: 'CV file could not be read', 'download-failed': 'CV download failed' }[m.cvStatus]);
  return out;
}
const needsLook = (m) => m.isCandidate && !m.reviewed && issues(m).length > 0;

/* ---------------- Microsoft sign-in (MSAL, no secret) ---------------- */
let msal = null, account = null;
const scopes = () => S.mailbox ? ['User.Read', 'Mail.Read', 'Mail.Read.Shared'] : ['User.Read', 'Mail.Read'];
const redirectUri = () => location.origin + '/redirect.html';
async function initMsal() {
  if (DEMO) { account = { username: 'hr@westcoastin.com', name: 'Demo mode' }; return; }
  if (!S.clientId || !S.tenantId || !window.msal) return;
  msal = new window.msal.PublicClientApplication({
    auth: { clientId: S.clientId, authority: `https://login.microsoftonline.com/${S.tenantId}`, redirectUri: redirectUri() },
    cache: { cacheLocation: 'localStorage' },
  });
  if (msal.initialize) await msal.initialize();
  account = msal.getAllAccounts()[0] || null;
}
async function connect() {
  if (!S.clientId || !S.tenantId) { location.hash = '#/settings'; toast('Add the Client ID and Tenant ID first.', true); return; }
  if (!msal) await initMsal();
  if (!msal) { toast('Microsoft sign-in library did not load. Check the internet connection and refresh.', true); return; }
  try {
    const r = await msal.loginPopup({ scopes: scopes(), prompt: 'select_account' });
    account = r.account; msal.setActiveAccount(account);
    toast('Outlook connected'); renderConn(); scan();
  } catch (e) { toast(friendlyAuthError(e), true); }
}
async function disconnect() {
  if (msal && account) { try { await msal.logoutPopup({ account, mainWindowRedirectUri: location.href }); } catch { /* ignore */ } }
  account = null; renderConn();
}
function friendlyAuthError(e) {
  const m = String(e?.errorMessage || e?.message || e);
  if (/AADSTS50011/.test(m)) return `Redirect URI mismatch. Add ${redirectUri()} under Single-page application in the app registration.`;
  if (/AADSTS65001|consent/i.test(m)) return 'Permission Mail.Read is not approved yet. Add it in the app registration (Delegated) and sign in again.';
  if (/popup_window_error|BrowserAuthError: popup/i.test(m)) return 'The sign-in pop-up was blocked. Allow pop-ups for this site and try again.';
  if (/user_cancelled/i.test(m)) return 'Sign-in was cancelled.';
  return 'Sign-in failed: ' + m.slice(0, 160);
}
async function token() {
  if (!msal || !account) throw new Error('Outlook is not connected');
  try { return (await msal.acquireTokenSilent({ scopes: scopes(), account })).accessToken; }
  catch (e) { return (await msal.acquireTokenPopup({ scopes: scopes(), account })).accessToken; }
}

/* ---------------- Microsoft Graph ---------------- */
const GRAPH = 'https://graph.microsoft.com/v1.0';
const base = () => S.mailbox ? `/users/${encodeURIComponent(S.mailbox)}` : '/me';
async function graph(path, { as = 'json', headers = {} } = {}) {
  const url = path.startsWith('http') ? path : GRAPH + path;
  for (let attempt = 0; attempt < 4; attempt++) {
    const res = await fetch(url, { headers: { Authorization: 'Bearer ' + await token(), ...headers } });
    if (res.ok) return as === 'buffer' ? res.arrayBuffer() : res.json();
    if (res.status === 429 || res.status >= 500) { await sleep((Number(res.headers.get('Retry-After')) || 2 * (attempt + 1)) * 1000); continue; }
    let msg = ''; try { msg = (await res.json()).error?.message || ''; } catch { /* */ }
    if (res.status === 403) throw new Error(S.mailbox ? `No access to ${S.mailbox}. You need full access to that mailbox.` : 'Access denied. Mail.Read permission is missing.');
    throw new Error(`Outlook error ${res.status}${msg ? ': ' + msg : ''}`);
  }
  throw new Error('Outlook is busy, try again in a minute');
}
async function listNewMessages(sinceISO) {
  const filter = encodeURIComponent(`receivedDateTime ge ${sinceISO}`);
  let url = `${base()}/mailFolders/${encodeURIComponent(S.folder || 'inbox')}/messages?$filter=${filter}&$orderby=receivedDateTime desc&$top=50&$select=id,subject,from,receivedDateTime,hasAttachments,bodyPreview,webLink`;
  const out = [];
  for (let p = 0; p < 40 && url; p++) { const r = await graph(url); out.push(...(r.value || [])); url = r['@odata.nextLink']; }
  return out;
}

/* ---------------- file reading (in browser) ---------------- */
async function fileText(buf, name) {
  const n = name.toLowerCase();
  if (n.endsWith('.pdf')) {
    await loadScript(CDN.pdf); window.pdfjsLib.GlobalWorkerOptions.workerSrc = CDN.pdfWorker;
    const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(buf.slice(0)) }).promise;
    let text = '';
    for (let i = 1; i <= Math.min(pdf.numPages, 8); i++) {
      const c = await (await pdf.getPage(i)).getTextContent();
      let lastY = null;
      for (const it of c.items) {
        const y = it.transform ? Math.round(it.transform[5]) : null;
        text += (lastY !== null && y !== null && Math.abs(y - lastY) > 2) ? '\n' : (text && !text.endsWith('\n') ? ' ' : '');
        text += it.str; lastY = y;
      }
      text += '\n';
    }
    return text.replace(/[ \t]+/g, ' ').replace(/\n\s*\n+/g, '\n').trim();
  }
  if (n.endsWith('.docx')) {
    await loadScript(CDN.mammoth);
    return (await window.mammoth.extractRawText({ arrayBuffer: buf.slice(0) })).value.trim();
  }
  if (n.endsWith('.txt')) return new TextDecoder().decode(buf).trim();
  return '';
}
async function ocrFile(buf, name, onProgress) {
  await loadScript(CDN.tesseract);
  const images = [];
  if (/\.pdf$/i.test(name)) {
    await loadScript(CDN.pdf); window.pdfjsLib.GlobalWorkerOptions.workerSrc = CDN.pdfWorker;
    const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(buf.slice(0)) }).promise;
    for (let i = 1; i <= Math.min(pdf.numPages, 2); i++) {
      const page = await pdf.getPage(i); const vp = page.getViewport({ scale: 2 });
      const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
      await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise; images.push(cv);
    }
  } else images.push(new Blob([buf]));
  let text = '';
  for (const [k, img] of images.entries()) {
    const r = await window.Tesseract.recognize(img, 'eng', { logger: (m) => m.status === 'recognizing text' && onProgress && onProgress((k + m.progress) / images.length) });
    text += r.data.text + '\n';
  }
  return text.trim();
}
const OK_FILE = /\.(pdf|docx?|txt|jpe?g|png)$/i;
function pickCv(atts) {
  const files = atts.filter((a) => !a.isInline && OK_FILE.test(a.name || '') && (a.size || 0) < 15e6 && !(/\.(jpe?g|png)$/i.test(a.name) && a.size < 30000));
  const score = (a) => (Parser.CV_FILE.test(a.name) ? 5 : 0) + (/\.pdf$/i.test(a.name) ? 3 : /\.docx$/i.test(a.name) ? 2 : 0);
  return files.sort((a, b) => score(b) - score(a))[0] || null;
}

/* ---------------- processing one email ---------------- */
async function processMessage(meta, { force = false } = {}) {
  const from = meta.from?.emailAddress || {};
  const rec = byId.get(meta.id) || {};
  const m = {
    id: meta.id, received: meta.receivedDateTime, subject: meta.subject || '(no subject)',
    from_name: from.name || '', from_email: (from.address || '').toLowerCase(), webLink: meta.webLink || rec.webLink || '',
    stage: rec.stage || 'New', notes: rec.notes || '', processedAt: new Date().toISOString(),
    syncedAt: rec.syncedAt || '', driveLink: rec.driveLink || '', reviewed: rec.reviewed || false,
  };
  try {
    const body = (await getBody(meta.id)).body?.content || meta.bodyPreview || '';
    const atts = meta.hasAttachments ? ((await listAtt(meta.id)).value || []) : [];
    m.attachments = atts.filter((a) => !a.isInline).map((a) => ({ id: a.id, name: a.name, size: a.size }));
    const cls = Parser.classify({ subject: m.subject, body, senderEmail: m.from_email, attachments: atts });
    m.isCandidate = force || cls.isCandidate; m.score = cls.score; m.reason = force ? 'Marked as candidate by HR' : cls.reason;
    m.bodyText = body.slice(0, 6000);
    if (!m.isCandidate) { await saveMail(m); return m; }

    let cvText = ''; m.cvStatus = 'none';
    const cv = pickCv(atts);
    if (cv) {
      m.cvName = cv.name; m.cvId = cv.id;
      let buf = null;
      try { buf = await getAtt(meta.id, cv.id); } catch { m.cvStatus = 'download-failed'; }
      if (buf) {
        if (!DEMO) await DB.put('files', { id: meta.id, name: cv.name, type: cv.contentType || '', data: buf });
        try {
          cvText = await fileText(buf, cv.name);
          m.cvStatus = cvText.length >= 80 ? 'read' : /\.(pdf|jpe?g|png)$/i.test(cv.name) ? 'scanned' : 'unreadable';
        } catch (e) { m.cvStatus = 'unreadable'; m.cvError = String(e.message || e).slice(0, 120); }
      }
    }
    m.cvText = cvText.slice(0, 20000);
    m.cand = Parser.extract({ subject: m.subject, body, senderName: m.from_name, senderEmail: m.from_email, cvText });
    if (rec.edited && rec.cand) m.cand = { ...m.cand, ...rec.cand }; // keep HR's manual corrections
    m.edited = !!rec.edited;
  } catch (e) {
    m.isCandidate = rec.isCandidate ?? true; m.error = String(e.message || e).slice(0, 160); m.cand = rec.cand || {};
  }
  await saveMail(m);
  return m;
}

const GSCOPE = 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.file';
const GTOK_KEY = 'wchd.gtok';

let gClient = null, gWaiter = null, syncing = false, gProblem = '';

async function gInit() {
  if (!S.gClientId) throw new Error('Add the Google Client ID in Settings first.');
  await loadScript('https://accounts.google.com/gsi/client');
  if (!gClient) gClient = window.google.accounts.oauth2.initTokenClient({
    client_id: S.gClientId, scope: GSCOPE,
    callback: (r) => gWaiter && gWaiter(r),
    error_callback: (e) => gWaiter && gWaiter({ error: e.type || 'popup_closed', error_description: e.message }),
  });
}
async function gSignIn(consent = false) {
  await gInit();
  const r = await new Promise((res) => { gWaiter = res; gClient.requestAccessToken({ prompt: consent ? 'consent' : '' }); });
  gWaiter = null;
  if (r.error) throw new Error(r.error === 'popup_closed' || r.error === 'popup_failed_to_open' ? 'Google sign-in window was closed or blocked. Allow pop-ups and try again.' : (r.error_description || r.error));
  if (window.google.accounts.oauth2.hasGrantedAllScopes && !window.google.accounts.oauth2.hasGrantedAllScopes(r, ...GSCOPE.split(' ')))
    throw new Error('Please tick both boxes (Sheets and Drive) on the Google permission screen.');
  gTok = { token: r.access_token, exp: Date.now() + (r.expires_in || 3600) * 1000 };
  localStorage.setItem(GTOK_KEY, JSON.stringify(gTok));

async function gFetch(url, opts = {}, interactive = false) {
  if (!gValid()) {
    if (!interactive) { const e = new Error('Google sign-in expired'); e.needsLogin = true; throw e; }
    await gSignIn(!S.gConnected);
  }
  for (let attempt = 0; attempt < 4; attempt++) {
    const res = await fetch(url, { ...opts, headers: { Authorization: 'Bearer ' + gTok.token, ...(opts.headers || {}) } });
    if (res.ok) { const t = await res.text(); return t ? JSON.parse(t) : {}; }
    if (res.status === 401) { gTok = null; localStorage.removeItem(GTOK_KEY); const e = new Error('Google sign-in expired'); e.needsLogin = true; throw e; }
    if (res.status === 429 || res.status >= 500) { await sleep(1500 * (attempt + 1)); continue; }
    let msg = ''; try { msg = (await res.json()).error?.message || ''; } catch { /* */ }
    if (res.status === 403 && /sheets/.test(url)) throw new Error('This Google account cannot edit the sheet. Share the sheet with it as Editor.');
    if (res.status === 404 && /sheets/.test(url)) throw new Error('Sheet not found. Check the Sheet link in Settings.');
    throw new Error(`Google error ${res.status}${msg ? ': ' + msg : ''}`);
  }

async function ensureDriveFolder(interactive) {

async function uploadCv(m, interactive) {

async function syncSheet({ interactive = false } = {}) {
  if (syncing || DEMO || !S.gClientId || !S.sheetId) return;
  const todo = pendingSync();
  if (!todo.length && !interactive) return;
  syncing = true; renderConn();
  const API = `https://sheets.googleapis.com/v4/spreadsheets/${S.sheetId}`;
  let wrote = 0, cvErr = 0;
  try {
    if (!S.sheetTitle || interactive) {
      const meta = await gFetch(`${API}?fields=properties.title,sheets.properties.title`, {}, interactive);
      S.sheetTitle = meta.properties?.title || ''; 
      const tabs = (meta.sheets || []).map((x) => x.properties.title);
      if (!tabs.includes(S.sheetTab)) S.sheetTab = tabs[0] || 'Sheet1';
      saveSettings();
    }
    // headers: keep existing, add missing ones at the end
    const h = await gFetch(`${API}/values/${tabRef()}!1:1`, {}, interactive);
    let headers = (h.values?.[0] || []).map((x) => String(x).trim());
    const missing = SHEET_COLS.filter((c) => !headers.includes(c));
    if (missing.length) {
      headers = [...headers, ...missing];
      await gFetch(`${API}/values/${tabRef()}!A1:${colL(headers.length - 1)}1?valueInputOption=RAW`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ values: [headers] }) }, interactive);
    }
    const idCol = colL(headers.indexOf('emailId'));
    const ids = await gFetch(`${API}/values/${tabRef()}!${idCol}2:${idCol}`, {}, interactive);
    const rowOf = new Map(); (ids.values || []).forEach((r, i) => { if (r[0]) rowOf.set(String(r[0]), i + 2); });

    const updates = [], appends = [], done = [];
    for (const m of todo.slice(0, 200)) {
      if (S.saveCvs && m.isCandidate && m.cvName && !m.driveLink) {
        try { m.driveLink = await uploadCv(m, interactive); } catch (e) { if (e.needsLogin) throw e; cvErr++; }
      }
      const obj = sheetRow(m);
      const row = headers.map((k) => (k in obj ? (k === 'phone' || k === 'alt_phone' ? obj[k] : cell(obj[k])) : null));
      const r = rowOf.get(m.id);
      if (r) updates.push({ range: `'${S.sheetTab}'!A${r}:${colL(headers.length - 1)}${r}`, values: [row] });
      else if (m.isCandidate) appends.push(row.map((v) => v ?? ''));
      done.push(m);
    }
    if (updates.length) await gFetch(`${API}/values:batchUpdate`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ valueInputOption: 'USER_ENTERED', data: updates }) }, interactive);
    if (appends.length) await gFetch(`${API}/values/${tabRef()}!A1:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS`,
      { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ values: appends }) }, interactive);

    wrote = done.length; gProblem = '';
    if (interactive || wrote) toast(wrote ? `Google Sheet updated: ${appends.length} added, ${updates.length} updated` + (cvErr ? ` (${cvErr} CV uploads failed)` : '') : 'Google Sheet is up to date');
    if (pendingSync().length) setTimeout(() => syncSheet(), 500);
  } catch (e) {
    gProblem = e.needsLogin ? 'expired' : e.message;

}

      ${m.cvText ? `<details style="margin-top:8px"><summary style="cursor:pointer;font-weight:600">Show CV text</summary><pre style="white-space:pre-wrap;font:inherit;background:var(--soft);padding:12px;border-radius:6px;max-height:260px;overflow:auto">${esc(m.cvText)}</pre></details>` : ''}

      if (text.length < 40) throw new Error('No readable text found in the image');

async function cvFile(m) {
  let f = DEMO ? null : await DB.get('files', m.id);
  if (!f) {
    if (!account || !m.cvId) throw new Error('CV is not stored on this computer. Connect Outlook to download it.');
    f = { id: m.id, name: m.cvName, type: '', data: await getAtt(m.id, m.cvId) };
    if (!DEMO) await DB.put('files', f);
  }
  return f;
}
async function openCv(m) {
  try {
    const f = await cvFile(m);
    const type = /\.pdf$/i.test(f.name) ? 'application/pdf' : /\.png$/i.test(f.name) ? 'image/png' : /\.jpe?g$/i.test(f.name) ? 'image/jpeg' : f.type || 'application/octet-stream';
    const url = URL.createObjectURL(new Blob([f.data], { type }));
    if (/pdf|image/.test(type)) window.open(url, '_blank');
    else { const a = document.createElement('a'); a.href = url; a.download = f.name; a.click(); }
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) { toast(e.message, true); }
}

/* ---------------- Excel export ---------------- */
async function exportExcel(list, kind) {
  if (!list.length) return toast('Nothing to export', true);
  let rows;
  if (kind === 'bio') {
    rows = list.map((m) => { const c = m.cand || {}; return {
      Post: c.position || '', Qualification: c.qualification || '', 'Candidate Name': c.candidate_name || m.from_name || '',
      'Mobile No': (c.phone || '').replace(/^\+91\s*/, '').replace(/\s/g, ''), 'Email Id': c.email || '', City: c.location || '',
      Experience: c.experience_years ? (c.experience_years === 'Fresher' ? 'Fresher' : c.experience_years + ' Years') : '',
      Remark: [m.stage !== 'New' ? m.stage : '', m.notes].filter(Boolean).join(' - '), 'Entry By': S.entryBy || 'HR', 'Entry Date': fmtDate(m.received) }; });
  } else {
    rows = list.map((m) => { const c = m.cand || {}; return {
      'Candidate Name': c.candidate_name || m.from_name || '', Mobile: c.phone || '', 'Other Mobile': c.alt_phone || '', Email: c.email || '',
      'Post Applied': c.position || '', Qualification: c.qualification || '', 'Education Details': c.education || '',
      'Experience (Years)': c.experience_years || '', 'Current Company': c.current_company || '', City: c.location || '',
      'Current CTC': c.current_ctc || '', 'Expected CTC': c.expected_ctc || '', 'Notice Period': c.notice_period || '',
      Skills: c.skills || '', LinkedIn: c.linkedin || '', Source: c.source || '', Stage: m.stage, 'HR Notes': m.notes || '',
      'CV File': m.cvName || '', 'Email Subject': m.subject, 'Email From': m.from_email, Received: fmtTime(m.received),
      Status: needsLook(m) ? 'Needs a look: ' + issues(m).join(', ') : 'OK' }; });
  }
  const name = `${kind === 'bio' ? 'Bio-data list' : 'Candidates'} ${dayKey(Date.now())}`;
  try {
    await loadScript(CDN.xlsx);
    const ws = window.XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = Object.keys(rows[0]).map((k) => ({ wch: Math.min(45, Math.max(k.length + 2, ...rows.slice(0, 200).map((r) => String(r[k] || '').length + 1))) }));
    const wb = window.XLSX.utils.book_new(); window.XLSX.utils.book_append_sheet(wb, ws, kind === 'bio' ? 'Bio-data list' : 'Candidates');
    window.XLSX.writeFile(wb, name + '.xlsx');
  } catch {
    const keys = Object.keys(rows[0]); const q = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const csv = '\ufeff' + [keys.map(q).join(','), ...rows.map((r) => keys.map((k) => q(r[k])).join(','))].join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = name + '.csv'; a.click();
    toast('Excel library unavailable, saved as CSV instead');
  }
}

    <div class="field"><label for="sCid">Client ID (Application ID)</label><input id="sCid" value="${esc(S.clientId)}" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"></div>
    <div class="field"><label for="sTid">Tenant ID (Directory ID)</label><input id="sTid" value="${esc(S.tenantId)}"></div>
    <div class="field"><label for="sMb">Shared HR mailbox (optional)</label><input id="sMb" value="${esc(S.mailbox)}" placeholder="Leave empty to read your own inbox">
      <div class="help">Fill this only if candidates write to a shared mailbox such as hr@… that you have access to.</div></div>
    <div class="field"><label for="sFo">Folder</label><input id="sFo" value="${esc(S.folder)}"><div class="help">Usually <b>inbox</b>.</div></div>
    <div class="field"><label>Redirect URI to add in the app registration (Single-page application)</label>
      <div class="copyrow"><input readonly value="${esc(redirectUri())}" id="sRu"><button class="btn" id="sCopy">Copy</button></div>
      <div class="help">Permissions needed (Delegated): User.Read, Mail.Read${S.mailbox ? ', Mail.Read.Shared' : ''}.</div></div>
    <button class="btn primary" id="sSave">Save connection settings</button>
  </div>
  <div class="card" style="grid-column:1/-1"><h2>Google Sheet</h2>
    <p class="hint">Candidates are added to this sheet. HR signs in with Google; no password or secret key is stored.</p>
    <div class="form">
      <div class="full"><label for="gSheet">Sheet link or ID</label><input id="gSheet" value="${esc(S.sheetId)}"></div>
      <div><label for="gTab">Tab name</label><input id="gTab" value="${esc(S.sheetTab)}"></div>
      <div><label for="gCid">Google Client ID</label><input id="gCid" value="${esc(S.gClientId)}" placeholder="xxxx.apps.googleusercontent.com"></div>
      <div class="full"><label>Authorized JavaScript origin to add in Google Cloud</label>
        <div class="copyrow"><input readonly value="${esc(location.origin)}"><button class="btn" id="gCopy">Copy</button></div></div>
      <div class="full"><label class="check"><input type="checkbox" id="gCv" ${S.saveCvs ? 'checked' : ''}> Also save each CV to Google Drive and put its link in the sheet</label></div>
    </div>
    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="gSave">Save and connect</button>
      <button class="btn" id="gAll" title="Write every candidate on this computer to the sheet again">Re-save all rows</button></div>
  </div>
  <div class="grid" style="align-content:start">
  <div class="card"><h2>Checking emails</h2>
    <div class="field"><label for="sLb">First check looks back (days)</label><input id="sLb" type="number" min="1" max="365" value="${S.lookbackDays}"></div>
    <div class="field"><label class="check"><input type="checkbox" id="sAo" ${S.autoOn ? 'checked' : ''}> Check automatically while this page is open</label></div>
    <div class="field"><label for="sAm">Every (minutes)</label><input id="sAm" type="number" min="2" max="240" value="${S.autoMinutes}"></div>
    <div class="field"><label for="sEb">“Entry By” name for bio-data export</label><input id="sEb" value="${esc(S.entryBy)}"></div>
    <button class="btn primary" id="sSave2">Save</button>
    <button class="btn" id="sRescan" title="Look back again from the first-check date">Check older emails again</button>
  </div>
  <div class="card"><h2>Logo</h2><p class="hint">Upload the West-Coast logo. It is kept in this browser.</p>
    <input type="file" id="sLogo" accept="image/*"> ${S.logo ? '<button class="btn sm" id="sLogoX">Use default</button>' : ''}</div>
  <div class="card"><h2>Data on this computer</h2>
    <p class="hint">${candidates().length} candidates and ${skipped().length} other emails are stored in this browser.</p>
    <button class="btn" id="sBack">Download backup</button>
    <label class="btn" for="sRest">Restore backup</label><input type="file" id="sRest" accept=".json" hidden>
    <button class="btn danger" id="sClear">Delete all data</button></div>
  </div></div>`;
  $('#sCopy').onclick = () => { navigator.clipboard?.writeText(redirectUri()); toast('Copied'); };
  $('#gCopy').onclick = () => { navigator.clipboard?.writeText(location.origin); toast('Copied'); };
  $('#gSave').onclick = () => {
    const raw = $('#gSheet').value.trim(); const id = (raw.match(/\/d\/([A-Za-z0-9_-]{20,})/) || [])[1] || raw;
    const cid = $('#gCid').value.trim();
    if (cid !== S.gClientId) { gClient = null; gTok = null; localStorage.removeItem(GTOK_KEY); S.gConnected = false; }
    if (id !== S.sheetId) { MAILS.forEach((m) => { m.syncedAt = ''; }); S.sheetTitle = ''; }
    Object.assign(S, { sheetId: id || DEFAULT_SHEET, sheetTab: $('#gTab').value.trim() || 'Sheet1', gClientId: cid, saveCvs: $('#gCv').checked });
    saveSettings(); render(); if (cid) syncSheet({ interactive: true });
  };
  $('#gAll').onclick = async () => { for (const m of MAILS) { if (m.syncedAt) { m.syncedAt = ''; await saveMail(m, { touch: false }); } } syncSheet({ interactive: true }); };
  $('#sSave').onclick = async () => {
    Object.assign(S, { clientId: $('#sCid').value.trim(), tenantId: $('#sTid').value.trim(), mailbox: $('#sMb').value.trim(), folder: $('#sFo').value.trim() || 'inbox' });
    saveSettings(); msal = null; account = null; await initMsal(); toast('Saved. Now press Connect Outlook.'); render();
  };
  $('#sSave2').onclick = () => {
    Object.assign(S, { lookbackDays: Math.max(1, Number($('#sLb').value) || 30), autoOn: $('#sAo').checked, autoMinutes: Math.max(2, Number($('#sAm').value) || 10), entryBy: $('#sEb').value.trim() });
    saveSettings(); setupAuto(); toast('Saved'); render();
  };
  $('#sRescan').onclick = () => { META.lastScan = ''; saveMeta(); scan(); };
  $('#sLogo').onchange = (e) => { const f = e.target.files[0]; if (!f) return; const r = new FileReader();
    r.onload = () => { S.logo = r.result; saveSettings(); applyLogo(); toast('Logo updated'); render(); }; r.readAsDataURL(f); };
  if ($('#sLogoX')) $('#sLogoX').onclick = () => { S.logo = ''; saveSettings(); applyLogo(); render(); };
  $('#sBack').onclick = () => { const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify({ version: 1, exported: new Date().toISOString(), mails: MAILS }, null, 1)], { type: 'application/json' }));
    a.download = `hr-mail-desk-backup-${dayKey(Date.now())}.json`; a.click(); };
  $('#sRest').onchange = async (e) => { try { const j = JSON.parse(await e.target.files[0].text());
    for (const m of j.mails || []) await saveMail(m); toast(`${(j.mails || []).length} records restored`); render(); } catch { toast('That is not a valid backup file', true); } };
  $('#sClear').onclick = async () => { if (!confirm('Delete all candidates and stored CVs from this computer? Outlook emails are not touched.')) return;
    await DB.clear('mails'); await DB.clear('files'); META.lastScan = ''; saveMeta(); await loadAll(); render(); toast('All data deleted'); };
}

/* ---------------- logo ---------------- */
function applyLogo() {
  const img = $('#brandLogo'), wm = $('#wordmark');
  img.onerror = () => { img.hidden = true; wm.hidden = false; };
  img.onload = () => { img.hidden = false; wm.hidden = true; };
  img.src = S.logo || 'logo.png';
}

/* ---------------- demo data (?demo) ---------------- */
function demoData() {
  const d = (h) => new Date(Date.now() - h * 3600e3).toISOString();
  const mk = (i, h, name, pos, q, exp, city, stage, extra = {}) => ({ id: 'demo' + i, received: d(h), subject: `Application for ${pos}`, from_name: name, from_email: name.toLowerCase().replace(/ /g, '.') + '@gmail.com',
    isCandidate: true, reason: 'CV attached, subject mentions job/CV', stage, notes: '', cvStatus: 'read', cvName: name.split(' ')[0] + '_Resume.pdf',
    cand: { candidate_name: name, phone: '+91 9' + String(800000000 + i * 7919).slice(0, 4) + ' ' + String(10000 + i * 371).slice(0, 5), email: name.toLowerCase().replace(/ /g, '.') + '@gmail.com', position: pos, qualification: q, education: q + ', Gujarat Technological University', experience_years: exp, location: city, skills: 'HPLC, GC, GMP, Documentation', source: 'Direct email' }, ...extra });
  const P = [['QC Officer', 'B.Pharm'], ['QA Executive', 'M.Pharm'], ['Production Officer', 'B.Pharm'], ['Microbiologist', 'M.Sc'], ['QC Chemist', 'B.Sc'], ['Formulation Development', 'M.Pharm']];
  const N = ['Ravi Patel', 'Neha Shah', 'Amit Sharma', 'Pooja Desai', 'Kunal Mehta', 'Riya Joshi', 'Harsh Thakkar', 'Komal Parmar', 'Jay Prajapati', 'Nirali Trivedi', 'Mehul Chauhan', 'Krupa Vyas', 'Darshan Solanki', 'Hetal Rathod', 'Vishal Panchal', 'Dhruvi Modi', 'Sagar Rana', 'Bhavik Soni'];
  const C = ['Kalol', 'Ahmedabad', 'Gandhinagar', 'Mehsana', 'Vadodara', 'Kadi'];
  const out = N.map((n, i) => { const [p, q] = P[i % P.length]; return mk(i, i * 17 + 2, n, p, q, i % 4 === 0 ? 'Fresher' : String((i % 7) + 1), C[i % C.length], STAGES[i % 3 === 0 ? 1 : i % 5 === 0 ? 2 : 0]); });
  out[3].cand.phone = ''; out[3].cand.email = ''; out[7].cvStatus = 'scanned'; out[7].cand.candidate_name = '';
  out.push({ id: 'demoX', received: d(5), subject: 'Invoice 4521 - lab chemicals', from_name: 'Shree Chemicals', from_email: 'accounts@shreechem.in', isCandidate: false, reason: 'looks like business mail' });
  return out;
}

/* ---------------- boot ---------------- */
async function boot() {
  applyLogo();
  $('#menuBtn').onclick = () => $('#side').classList.toggle('open');
  $('#modalBack').onclick = (e) => { if (e.target.id === 'modalBack') closeModal(); };
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
  window.addEventListener('hashchange', render);
  await loadAll();
  try { await initMsal(); } catch (e) { console.warn(e); }
  render(); setupAuto();
  if (account && !DEMO) setTimeout(() => scan({ quiet: true }), 800);
}
boot();

</script>
</body>
</html>
